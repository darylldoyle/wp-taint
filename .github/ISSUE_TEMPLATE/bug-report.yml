name: "Bug / crash / non-convergence"
description: "wp-taint errored, could not parse a file, or reported that a fixed point did not converge."
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        This is for the tool *breaking*, as opposed to being wrong about a
        finding. A fatal error, a file it cannot parse, or a
        "fixed point did not converge" warning all belong here — the last one
        especially, because it means results for that function are incomplete
        and it is always an engine bug we want to fix.
  - type: dropdown
    id: kind
    attributes:
      label: "What happened?"
      options:
        - "Fatal error / crash"
        - "A file failed to parse (exit code 2)"
        - "Fixed point did not converge (a warning naming a function)"
        - "Ran out of memory"
        - "Wrong output that is not a false positive or negative (bad trace, mangled path, etc.)"
        - "Something else"
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: "The command you ran"
      description: "The full wp-taint command, and the output or error, including any warning it printed."
      render: shell
    validations:
      required: true
  - type: textarea
    id: code
    attributes:
      label: "The code involved, if you can share it"
      description: |
        For a parse failure or non-convergence, the file (or the function the
        warning named) is what lets us reproduce it. A minimal version is ideal.
      render: php
    validations:
      required: false
  - type: input
    id: version
    attributes:
      label: "wp-taint version"
      placeholder: "0.1.0"
    validations:
      required: true
  - type: input
    id: php
    attributes:
      label: "PHP version"
      description: "Output of `php --version` (first line)."
      placeholder: "8.3.x"
    validations:
      required: true
