name: TEMP baseline dump

# Throwaway: regenerates the corpus baseline in CI (which can reach
# downloads.wordpress.org) and dumps the exact JSON plus the new object-level
# authorization findings for verification. Deleted once the baseline is
# committed. Never merged.

on:
  push:
    branches: [claude/plugin-auth-analysis-gaps-6ls4do]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dump:
    name: Dump regenerated corpus baseline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: json, zip
          coverage: none
          ini-values: memory_limit=6G

      - name: Install dependencies
        uses: ramsey/composer-install@v3

      - name: Fetch the pinned corpus
        run: composer corpus:lock

      - name: Regenerate and print the baseline
        run: |
          php tools/corpus-baseline.php
          echo '::group::regenerated corpus-baseline.json'
          cat tests/Fixtures/corpus-baseline.json
          echo '::endgroup::'

      - name: Dump the new-rule findings on the moved plugins
        run: |
          for plugin in duplicate-post wpforms-lite; do
            echo "::group::$plugin object-id / meta-cap findings"
            php bin/wp-taint scan "tests/Fixtures/corpus/$plugin" \
              --format=json --fail-on=never --no-ansi \
              | php -r '
                $d = json_decode(stream_get_contents(STDIN), true);
                foreach ($d["findings"] ?? [] as $f) {
                    if (!in_array($f["ruleId"], ["wp.authz.object-id-from-request","wp.authz.meta-cap-without-object"], true)) {
                        continue;
                    }
                    $loc = $f["location"] ?? [];
                    printf("%s  %s  %s:%d\n    %s\n",
                        $f["severity"], $f["ruleId"], $loc["file"] ?? "?", $loc["line"] ?? 0,
                        $f["message"] ?? "");
                    foreach ($f["trace"] ?? [] as $s) {
                        printf("      %s %s:%d  %s\n", $s["verb"], $s["file"] ?? "?", $s["line"] ?? 0, trim($s["snippet"] ?? ""));
                    }
                }
              '
            echo '::endgroup::'
          done
