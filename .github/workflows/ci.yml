name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests (PHP ${{ matrix.php }}${{ matrix.dependencies == 'lowest' && ', lowest deps' || '' }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
        dependencies: ['highest']
        include:
          # The lowest-dependency run is what catches "works on my lockfile".
          - php: '8.2'
            dependencies: 'lowest'

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: json, zip
          coverage: none
          ini-values: memory_limit=1G

      - name: Install dependencies
        uses: ramsey/composer-install@v3
        with:
          dependency-versions: ${{ matrix.dependencies }}

      - name: Run the test suite
        run: composer test

  static-analysis:
    name: PHPStan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          ini-values: memory_limit=1G

      - name: Install dependencies
        uses: ramsey/composer-install@v3

      - name: Analyse
        run: composer analyse

  coding-standards:
    name: PHP_CodeSniffer
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Install dependencies
        uses: ramsey/composer-install@v3

      - name: Lint
        run: composer lint

  type-coverage:
    name: Type coverage
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: xdebug

      - name: Install dependencies
        uses: ramsey/composer-install@v3

      - name: Check type coverage
        run: composer test:types

  fixtures:
    name: Fixture expectations in sync
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Install dependencies
        uses: ramsey/composer-install@v3

      # The .expected.json files are generated from the inline
      # wp-taint-expect annotations. Editing one without the other is a
      # drift hazard in the one place the project cannot afford it.
      - name: Check fixture expectations
        run: composer fixtures:check

  dogfood:
    name: Scan a real plugin
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: json, zip
          coverage: none
          ini-values: memory_limit=3G

      - name: Install dependencies
        uses: ramsey/composer-install@v3

      # A smaller corpus than the local one: enough to catch a regression that
      # only shows up on real code, without a five-minute download on every run.
      - name: Fetch a small corpus
        run: php tools/fetch-corpus.php --count=5

      # Analysis is whole-program, so a plugin is the natural unit. Scanning
      # five unrelated plugins as one program is neither realistic nor cheap.
      - name: List the corpus plugins
        id: plugins
        run: |
          {
            echo 'list<<EOF'
            find tests/Fixtures/corpus -mindepth 1 -maxdepth 1 -type d | sort
            echo EOF
          } >> "$GITHUB_OUTPUT"

      # The parse rate is the project's first kill gate. Anything below 99.5%
      # means files are being silently skipped, which is a silent false negative.
      - name: Check the parse rate
        run: |
          while read -r plugin; do
            echo "::group::$plugin"
            php bin/wp-taint scan "$plugin" --parse-report --no-ansi
            echo '::endgroup::'
          done <<< '${{ steps.plugins.outputs.list }}'

      - name: Scan each plugin
        run: |
          mkdir -p sarif
          while read -r plugin; do
            name=$(basename "$plugin")
            echo "::group::$name"
            php bin/wp-taint scan "$plugin" \
              --format=sarif --output="sarif/$name.sarif" --fail-on=never --no-ansi
            echo '::endgroup::'
          done <<< '${{ steps.plugins.outputs.list }}'

      - name: Upload the SARIF reports
        uses: actions/upload-artifact@v4
        with:
          name: corpus-sarif
          path: sarif/
          retention-days: 7

  corpus:
    name: Corpus baseline
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: json, zip
          coverage: none
          ini-values: memory_limit=6G

      - name: Install dependencies
        uses: ramsey/composer-install@v3

      # Eight plugins pinned by exact version. The full corpus is fifty at
      # latest-stable, which is right for triage and wrong for a tracked number:
      # it would move whenever upstream released, and a baseline that drifts on
      # its own teaches people to ignore it.
      - name: Cache the pinned plugins
        uses: actions/cache@v4
        with:
          path: tools/corpus-cache
          key: corpus-${{ hashFiles('tests/Fixtures/corpus-lock.json') }}

      - name: Fetch the pinned corpus
        run: composer corpus:lock

      # The fixture suite proves the engine finds what it should on code written
      # to be found. It proves nothing about the shapes real plugins are made
      # of, and the corpus caught seventeen bugs the fixtures never saw — two of
      # them false negatives, which make the count *fall*, the direction nobody
      # thinks to look in.
      - name: Check the corpus against its baseline
        run: composer corpus:check
