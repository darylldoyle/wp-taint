# =============================================================================
# SOURCES — second order (stored)
# =============================================================================
#
# Stored XSS is most of the WordPress CVE population, so these are on by
# default. `--no-stored-taint` turns them off for teams triaging reflected
# issues first.

# A remote HTTP response is somebody else's output. The endpoint may be one the
# plugin chose, but the bytes that came back are not, and echoing them or storing
# them is the same second-order problem an option is — which is why these carry
# the stored kinds rather than the request ones, and no `path` or `url` for the
# reason recorded on get_post_meta() below.
[[sources]]
function = "wp_remote_retrieve_body"
kinds = ["html", "html_attr", "sql", "unserialize_stored", "csv", "storage"]
stored = true
note = "The body of an HTTP response. Chosen by whoever runs the endpoint, not by the plugin that called it."

[[sources]]
function = "wp_remote_retrieve_header"
kinds = ["html", "html_attr", "sql", "unserialize_stored", "csv", "storage"]
stored = true

[[sources]]
function = "wp_remote_retrieve_headers"
kinds = ["html", "html_attr", "sql", "unserialize_stored", "csv", "storage"]
stored = true

[[sources]]
function = "get_post_meta"
kinds = ["html", "html_attr", "sql", "unserialize_stored", "csv", "storage"]
stored = true
note = "Second-order taint. Stored XSS lives here, and so does object injection: unserialize() on stored data is the classic WordPress escalation from a subscriber-level meta write to RCE through a POP chain, and three of the CVEs in tests/Fixtures/cve-lock.json are exactly that. Deliberately NOT path or url: an attacker who can write arbitrary options or post meta already has the access those sinks would give them, and treating stored data as filesystem or SSRF input drowned the corpus in noise. That reasoning does not extend to unserialize, because object injection grants more than the write did."

