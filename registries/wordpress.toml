# =============================================================================
# PROPAGATORS — the ones people mistake for escapers
# =============================================================================

[[propagators]]
function = "wp_unslash"
note = "Strips slashes only. Pure pass-through. This is the single most common misunderstanding in WordPress code review: wp_unslash() is NOT a sanitizer and must never be moved to [[sanitizers]]. If a test passes because wp_unslash cleared taint, the test is wrong."

[[propagators]]
function = "maybe_unserialize"
note = "Unserialises when the string looks serialised, so it propagates taint on top of being an object injection sink."

[[propagators]]
function = "wp_specialchars_decode"
note = "Un-escapes. The opposite of a sanitizer."

[[propagators]]
function = "wptexturize"

[[propagators]]
function = "wpautop"
note = "Adds paragraph tags. Escapes nothing."

[[propagators]]
function = "make_clickable"
note = "Turns URLs into anchors. Escapes nothing else."

[[propagators]]
function = "wp_trim_words"

[[propagators]]
function = "wp_strip_all_tags"
note = "Removes tags but leaves quotes and ampersands, so it is not sufficient for attribute context."

# shortcode_atts( $defaults, $atts ) merges the attributes written in the post
# body over the plugin's defaults and returns the result, so the attacker's half
# comes straight back out. It was listed as filterable and not as a propagator,
# which made the return clean and every shortcode callback that normalises its
# attributes the usual way read as safe.
[[propagators]]
function = "shortcode_atts"
args = [0, 1]

[[propagators]]
function = "apply_filters"
args = [1]
note = "The filtered value passes through even when no callback is registered. The callbacks themselves are followed through the hook graph; see [[dispatchers]] below."

[[propagators]]
function = "apply_filters_ref_array"
args = [1]

[[propagators]]
function = "get_the_title"

[[propagators]]
function = "get_the_content"

[[propagators]]
function = "get_the_excerpt"

