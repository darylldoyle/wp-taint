[[sanitizers]]
function = "absint"
clears = "*"
note = "Casts to a non-negative integer, which cannot carry a payload in any context."

# like_escape() lives in the generated catalogue clearing "sql". It escapes for
# a LIKE pattern inside quotes, so it carries the same caveat as esc_sql().
[[sanitizers]]
function = "like_escape"
clears = ["sql"]
quoted_only = true

[[sanitizers]]
function = "esc_sql"
clears = ["sql"]
quoted_only = true
note = "Escapes quotes and backslashes, which defends a quoted context and nothing else. Bare, `1 OR 1=1` passes through untouched."

[[sanitizers]]
class = "wpdb"
method = "_real_escape"
clears = ["sql"]
quoted_only = true

[[sanitizers]]
function = "wp_validate_redirect"
clears = ["url"]
note = "Falls back to the second argument when the host is not allowed."

[[sanitizers]]
function = "wp_json_encode"
clears = ["html"]
imprecise = true
note = "Only safe when the output lands inside a <script> JSON context. Modelled as clearing html but flagged imprecise."

[[sanitizers]]
function = "wp_nonce_field"
clears = "*"

[[sanitizers]]
function = "wp_create_nonce"
clears = "*"

[[sanitizers]]
function = "wp_hash"
clears = "*"

# wpdb::prepare is the interesting one. It only sanitises when its first
# argument is an effectively literal format string. When that argument is built
# from a variable, prepare() provides no protection at all and the call is
# reported under wp.sqli.prepare-non-literal instead.
[[sanitizers]]
class = "wpdb"
method = "prepare"
all_args = true
clears = ["sql"]
requires_literal_arg = 0
literal_violation_rule_id = "wp.sqli.prepare-non-literal"
note = "Only sanitises with a literal first argument. Interpolating a variable into the format string defeats it entirely."

# =============================================================================
# EXPLICITLY SAFE — do not re-add these as sinks
# =============================================================================

[[safe]]
class = "wpdb"
method = "insert"
note = "Escapes its data internally via prepare(). Flagging it is a guaranteed false positive."

[[safe]]
class = "wpdb"
method = "update"
note = "Escapes its data internally via prepare()."

[[safe]]
class = "wpdb"
method = "delete"
note = "Escapes its where clause internally via prepare()."

[[safe]]
class = "wpdb"
method = "replace"
note = "Escapes its data internally via prepare()."

[[safe]]
function = "wp_safe_redirect"
note = "Validates the target host against the allowed list. wp_redirect() is the unsafe variant."

[[safe]]
function = "esc_html_e"
note = "Escapes and echoes in one call, so the echo is not a separate sink."

