# =============================================================================
# RULE METADATA
# =============================================================================

# ---------------------------------------------------------------------------
# Hook dispatch.
#
# `apply_filters( 'the_content', $html )` is a call to every callback registered
# on `the_content`. Modelling it as a call to `apply_filters` loses the 9,173
# dispatch sites in the corpus, and with them every filter callback that reads
# request data.
#
# `hook = true` says the `callable` argument names a hook rather than holding a
# callable, so the callees come from the hook graph built from `add_action()`
# and `add_filter()`. Everything after that is the ordinary dispatcher
# machinery.
#
# A filter returns what its *callbacks* return, not what it was handed: at
# runtime each callback receives the previous one's output, so the original value
# only survives when nothing is registered. Saying both could come out would
# defeat every sanitizing filter. The nothing-registered case falls back to the
# [[propagators]] entry for apply_filters, which is the pass-through.
#
# Actions return nothing, so their callees' returns go nowhere — they are
# analysed for the sinks inside them.
# ---------------------------------------------------------------------------

[[dispatchers]]
function = "apply_filters"
callable = 0
hook = true
argument_start = 1
mode = "rest"
returns = "callee"

[[dispatchers]]
function = "apply_filters_ref_array"
callable = 0
hook = true
argument_start = 1
mode = "spread"
returns = "callee"

[[dispatchers]]
function = "do_action"
callable = 0
hook = true
argument_start = 1
mode = "rest"
returns = "own"
note = "An action returns nothing. Its callbacks are analysed for the sinks inside them."

[[dispatchers]]
function = "do_action_ref_array"
callable = 0
hook = true
argument_start = 1
mode = "spread"
returns = "own"

# ---------------------------------------------------------------------------
# Authorization primitives.
#
# What it takes for a callback to be doing a real check. The AJAX and REST rules
# walk the call graph from a callback looking for one of these, which is what
# credits a helper properly: `acf_verify_ajax()` counts because it calls
# `wp_verify_nonce`, not because its name contains "verify".
#
# Deliberately absent: `wp_die()`, `wp_get_current_user()` and
# `get_current_user_id()`. All three appear constantly in handlers with no
# authorization at all — `wp_die( 'ok' )` is how a handler *ends*, not how it
# checks anything.
# ---------------------------------------------------------------------------

# `proves` says what the call establishes. "entitlement" (the default) means the
# caller may do the thing. "intent" means only that the request was deliberate:
# a nonce is anti-CSRF, and a subscriber can hold a valid nonce for a form they
# should never be able to submit.
[[authorization]]
function = "current_user_can"

[[authorization]]
function = "current_user_can_for_blog"

[[authorization]]
function = "user_can"

[[authorization]]
function = "author_can"

[[authorization]]
function = "is_super_admin"

[[authorization]]
function = "is_user_logged_in"

[[authorization]]
function = "auth_redirect"

[[authorization]]
function = "check_ajax_referer"
proves = "intent"

[[authorization]]
function = "check_admin_referer"
proves = "intent"

[[authorization]]
function = "wp_verify_nonce"
proves = "intent"

[[authorization]]
function = "wp_check_password"

[[authorization]]
function = "wp_validate_auth_cookie"

[[authorization]]
class = "WP_User"
method = "has_cap"

# ---------------------------------------------------------------------------
# Translation.
#
# A translation function returns the translated *message*, not its arguments.
# The number handed to _n() picks which message; it does not come back out.
#
# These went uncatalogued until `--include-path` was pointed at WordPress core,
# at which point the engine learned _n()'s real body — which ends in
# `apply_filters( 'ngettext', $translation, $single, $plural, $number, … )`.
# With the hook graph following that filter, a callback returning its fourth
# parameter would hand the number back, so the count from a get_option() call
# reached an echo and Akismet gained three findings.
#
# Sound? A callback on `ngettext` really could return the number. Modelling that
# path costs three false positives on one plugin to describe a filter nobody
# writes, so the catalogue states the sensible model instead — which is what a
# hand-written entry is for, and why it wins over a learned summary.
# ---------------------------------------------------------------------------

[[propagators]]
function = "__"
arg = 0

[[propagators]]
function = "translate"
arg = 0

[[propagators]]
function = "_x"
arg = 0

[[propagators]]
function = "_n"
args = [0, 1]
note = "The number selects the message; it is not part of it."

[[propagators]]
function = "_nx"
args = [0, 1]

[[propagators]]
function = "translate_nooped_plural"
arg = 0

# ---------------------------------------------------------------------------
# Template loading.
#
# `get_template_part( 'parts/content', get_post_type(), [ 'title' => $title ] )`
# is the idiomatic form in a theme, and the shape a theme-heavy codebase is made
# of. Following `include` covers a plugin; this covers the other half.
#
# **Not an include.** A plain include shares the includer's entire variable
# scope; these go through load_template(), so the template body sees globals and
# the $args array and *not* the caller's locals. Modelling them as includes would
# connect every variable in the calling file to every template it loads, which
# would manufacture findings in exactly the files a theme puts its output in.
#
# `slug` is fixed where the function has no slug argument: get_header( 'shop' )
# loads header-shop.php, falling back to header.php.
# ---------------------------------------------------------------------------

[[templates]]
function = "get_template_part"
slug_arg = 0
name_arg = 1
args_arg = 2

[[templates]]
function = "get_header"
slug = "header"
name_arg = 0
args_arg = 1

[[templates]]
function = "get_footer"
slug = "footer"
name_arg = 0
args_arg = 1

[[templates]]
function = "get_sidebar"
slug = "sidebar"
name_arg = 0
args_arg = 1

[[templates]]
function = "load_template"
path_arg = 0
args_arg = 2
note = "Already resolved by locate_template(); the path is the argument."

# add_query_arg() reads $_SERVER['REQUEST_URI'] only when no base URI was handed
# to it, and where the base would sit depends on whether the first argument is an
# array or a key. `applies_by` names the check, because no static field can say.
#
# Unconditional, it produced SSRF findings on every plugin that builds a
# third-party API URL this way. Never a source, and reflected XSS through the
# current URL — a real and common bug — would go missing.
[[sources]]
function = "add_query_arg"
kinds = ["html", "html_attr", "url", "storage"]
applies_by = "add_query_arg_base"

[[propagators]]
function = "add_query_arg"
note = "With an explicit base it is a pure string build; see the [[sources]] entry for the other case."

[[propagators]]
function = "remove_query_arg"

# get_avatar() returns an <img> element it has escaped itself. Echoing it is the
# documented use, and treating the markup as taint reported every theme and
# plugin that shows an avatar.
[[safe]]
function = "get_avatar"
note = "Returns markup it escaped itself. get_avatar_url() is the one that returns a bare URL."

[[rules]]
id = "wp.sqli.wpdb-query"
title = "Untrusted input reaches a database query without preparation"
description = "A value derived from user-controlled input is interpolated into SQL passed to $wpdb, with sql taint intact."
remediation = "Pass the value as a placeholder argument to $wpdb->prepare() with a literal format string. esc_sql() is acceptable but prepare() is preferred."
cwe = "CWE-89"
message = "Untrusted input reaches a database query without preparation."

[[rules]]
id = "wp.sqli.prepare-non-literal"
title = "$wpdb->prepare() called with a non-literal format string"
description = "prepare() only escapes placeholder arguments against a literal format string. When the format string is itself built from a variable, prepare() provides no protection and the interpolated value reaches the database unescaped."
remediation = "Move every variable out of the format string and into a placeholder argument. Interpolating $wpdb table properties such as {$wpdb->prefix} is fine; interpolating request data is not."
cwe = "CWE-89"
message = "$wpdb->prepare() cannot protect a format string built from untrusted input."

[[rules]]
id = "wp.sqli.unprepared-query"
title = "Variable interpolated into a database query"
description = "A query string passed to $wpdb is built by interpolating or concatenating a variable that is not a known-safe database identifier. Taint analysis could not prove the value is attacker-controlled, but the shape alone is unsafe."
remediation = "Use $wpdb->prepare() with a literal format string and placeholder arguments."
cwe = "CWE-89"
message = "Variable interpolated into a database query without prepare()."

[[rules]]
id = "wp.redirect.open-redirect"
title = "Untrusted input reaches wp_redirect()"
description = "A value derived from user-controlled input is used as a redirect target. wp_redirect() does not validate the host."
remediation = "Use wp_safe_redirect(), or pass the value through wp_validate_redirect() with a safe fallback first."
cwe = "CWE-601"
message = "Untrusted input reaches wp_redirect() without host validation."

[[rules]]
id = "wp.ssrf.remote-request"
title = "Untrusted input reaches an outbound HTTP request"
description = "A value derived from user-controlled input is used as the URL of a server-side HTTP request, which allows an attacker to reach internal services."
remediation = "Validate the host against an allowlist before making the request."
cwe = "CWE-918"
message = "Untrusted input controls the URL of a server-side request."

[[rules]]
id = "wp.stored.untrusted-write"
title = "Untrusted input written to persistent storage without sanitisation"
description = "A value derived from user-controlled input is stored in an option or meta field with html taint intact, which becomes stored XSS when it is later rendered."
remediation = "Sanitise on write with sanitize_text_field() or wp_kses_post(), and escape again on output."
cwe = "CWE-79"
message = "Untrusted input written to storage without sanitisation."

[[rules]]
id = "wp.authz.rest-missing-permission-callback"
title = "REST route registered without a permission_callback"
description = "register_rest_route() was called without a permission_callback. WordPress treats such a route as public and has emitted a _doing_it_wrong notice for it since 5.5."
remediation = "Add a permission_callback that checks the capability the route requires. Use __return_true only for genuinely public read-only data."
cwe = "CWE-862"
message = "REST route registered without a permission_callback."

[[rules]]
id = "wp.authz.rest-public-write"
title = "REST route allows unauthenticated writes"
description = "A route handling POST, PUT, PATCH or DELETE declares permission_callback => '__return_true', which permits any unauthenticated request to invoke it."
remediation = "Replace __return_true with a current_user_can() check for the capability the operation requires."
cwe = "CWE-862"
message = "REST write route is callable by anyone."

[[rules]]
id = "wp.authz.rest-permission-callback-no-check"
title = "REST permission callback checks nothing"
description = "A route declares a permission_callback, but nothing reachable from that callback checks a capability, a nonce, or whether the user is logged in. Declaring a callback that always allows the request is the same bypass as declaring none, written less visibly."
remediation = "Have the callback call current_user_can() for the capability the operation requires, or return a WP_Error when the caller is not permitted."
cwe = "CWE-862"
message = "REST permission callback reaches no authorization check."

# wp_add_inline_script() prints its argument inside a <script> block, so it is a
# JavaScript context and no HTML escaper protects it. esc_js() and
# wp_json_encode() do.
[[sinks]]
function = "wp_add_inline_script"
args = [1]
kind = "html"
severity = "high"
rule_id = "wp.xss.unescaped-output"

[[sinks]]
function = "wp_add_inline_script"
args = [1]
kind = "unknown"
severity = "low"
rule_id = "wp.output.unescaped-unknown"

# Pluggable functions can be redefined outright by any plugin, which is a wider
# grant than a filter. The generated catalogue already lists most of them,
# because their core definitions happen to run filters too; wp_text_diff() is
# the one content-returning pluggable that does not, so it is curated here. The
# rest of pluggable.php returns booleans, objects and voids — nothing escaping
# could have been applied to.
[[filterable]]
function = "wp_text_diff"
params = [0, 1]

# Shortcode expansion is an extension point like any filter: a registered
# shortcode decides what comes back, so escaping before it is escaping too early.
[[filterable]]
function = "do_shortcode"

[[filterable]]
function = "do_shortcode_tag"

[[rules]]
id = "wp.output.unescaped-unknown"
title = "Output with nothing vouching for it"
description = "A value whose origin the scan cannot see reaches output with no escaper applied. It may be perfectly safe; nothing here says so. WordPress's standard is to escape on output wherever the value came from, and this reports the obligation rather than a traced flow."
remediation = "Escape at the point of output, for the context it lands in. If the value is genuinely constant, the escaper costs nothing and makes it provable."
cwe = "CWE-79"
message = "This value reaches output unescaped, and nothing in the scan says where it came from."

[[rules]]
id = "wp.output.csv-injection"
title = "Exported value can be a spreadsheet formula"
description = "A user-supplied value is written into CSV without neutralising a leading =, +, - or @. Excel and Sheets execute those cells as formulas when the file is opened, so an exported field becomes code running on whoever reviews the export (CWE-1236)."
remediation = "Prefix a value beginning with =, +, - or @ with an apostrophe, tab or space before writing the cell. HTML escapers do nothing here: esc_html() leaves a formula exactly as it found it."
cwe = "CWE-1236"
message = "This value is written into CSV without neutralising a leading formula character."

[[rules]]
id = "wp.xss.wrong-context-escape"
title = "The wrong escaper for where the value lands"
description = "An escaper is applied, and it is not the one this context needs. esc_html() inside a <script> block leaves a string breakout; esc_attr() on an href leaves a javascript: URI; any escaper in an unquoted attribute can be escaped out of with a space. A check that only asks whether an escaper was called reports nothing on any of these."
remediation = "Match the escaper to the context: wp_json_encode() or esc_js() inside script, esc_url() for href and src, esc_attr() inside a quoted attribute, and quote the attribute."
cwe = "CWE-79"
message = "This escaper does not protect the context the value is printed into."

[[rules]]
id = "wp.xss.escape-voided"
title = "Escaped value passed through a filter before output"
description = "The value was escaped and then handed to a hook that any plugin on the site may filter. Whatever the escaper guaranteed ended at that call: the filter returns a new value, and this code prints it. Escaping is called late escaping because it has to be the last thing that happens to a value."
remediation = "Escape at the point of output, after every filter has run: apply_filters() first, esc_html() on the result. If the filter genuinely needs the escaped form, escape again at the echo."
cwe = "CWE-79"
message = "This value was escaped and then filtered, so the escaping no longer holds."

[[rules]]
id = "wp.rce.unserialize-stored"
title = "Stored data reaches unserialize()"
description = "A value read from an option, post meta or a database row is unserialised, so a serialised object stored there is instantiated and a POP chain in the loaded code can run. This needs an attacker who can write that store first, which is what separates it from unserialising a request directly."
remediation = "Pass allowed_classes => false, which makes unserialize() return arrays and scalars only. If objects are genuinely needed, restrict allowed_classes to the exact list, and check who is able to write the option or meta this reads."
cwe = "CWE-502"
message = "Stored data is unserialised, so anyone who can write that store can instantiate objects."

[[rules]]
id = "wp.authz.arbitrary-option-write"
title = "Option name taken from the request"
description = "The name of the option being written comes from user-controlled input, so the caller chooses which option to set rather than merely what to set it to. WordPress stores privilege configuration in options: default_role, users_can_register, siteurl and the active theme are all writable this way."
remediation = "Never let the request choose the option. Keep an allowlist of the options this code owns and reject anything not on it; iterating $_POST and calling update_option( $name, $value ) hands the site over."
cwe = "CWE-915"
message = "The option being written is named by untrusted input, which is privilege escalation rather than stored data."

[[rules]]
id = "wp.csrf.nonce-without-action"
title = "Nonce created or verified without an action"
description = "Every nonce function defaults its action to -1. A -1 nonce verifies successfully, so the check appears to pass, but the token is shared with every other bare nonce on the site including core's. The nonce is no longer tied to this operation, which is what made it CSRF protection."
remediation = "Pass a specific action string, and pass the same one at both ends: wp_nonce_field( 'delete-item_' . $id ) paired with check_admin_referer( 'delete-item_' . $id )."
cwe = "CWE-352"
message = "This nonce uses the shared default action, so it does not tie the request to this operation."

[[rules]]
id = "wp.csrf.bypassable-nonce-check"
title = "Nonce check skipped when the nonce is absent"
description = "Guarding a nonce verification with isset() on the same parameter lets the request decide whether to be checked. Sending no nonce makes isset() false, so the conjunction is false and nothing is verified."
remediation = "Call check_admin_referer() or check_ajax_referer(), which die on a missing or invalid nonce, rather than testing wp_verify_nonce() behind an isset()."
cwe = "CWE-352"
message = "Omitting the nonce parameter skips this nonce check entirely."

[[rules]]
id = "wp.authz.guard-without-exit"
title = "Redirect in a failed check does not stop execution"
description = "wp_redirect() and wp_safe_redirect() send a Location header and return. They do not halt the script, so the statements after the guard run regardless of whether the check passed."
remediation = "Follow every redirect with exit. In a function, `wp_safe_redirect( $url ); exit;` — a bare return only leaves the function and lets the caller carry on."
cwe = "CWE-698"
message = "This redirect does not stop execution, so the code the check guards runs anyway."

[[rules]]
id = "wp.authz.admin-post-missing-check"
title = "admin-post.php handler with no authorization check"
description = "admin-post.php dispatches ?action=foo to the admin_post_foo hook. Any logged-in user can reach it, and anyone at all can reach the nopriv variant. Being under wp-admin is routing, not authorization: nothing below the callback checks a capability or a nonce."
remediation = "On admin_post_*, call current_user_can() with the capability the action needs and check_admin_referer() with the action name: the nonce proves intent, the capability proves entitlement. On admin_post_nopriv_*, a capability check cannot pass — the hook exists to serve logged-out visitors — so verify a nonce and confirm the endpoint reads nothing an anonymous caller should not choose. The trace step says which case this is."
cwe = "CWE-862"
message = "An admin-post.php handler runs with no capability or nonce check."

[[rules]]
id = "wp.input.setting-without-sanitize"
title = "Settings API option registered with no sanitize_callback"
description = "register_setting() was called without a sanitize_callback, so options.php stores whatever is posted for that option verbatim. The request never appears in the plugin's own code — core reads $_POST and core writes the option — so there is no flow to trace, only a missing argument."
remediation = "Pass a sanitize_callback in the third argument, choosing the sanitiser that matches what the option holds: sanitize_text_field() for a label, esc_url_raw() for a URL, absint() for an id, wp_kses_post() for markup."
cwe = "CWE-20"
message = "This setting is registered with no sanitize_callback."

[[rules]]
id = "wp.authz.ajax-missing-check"
title = "AJAX handler performs no capability or nonce check"
description = "A callback registered on a wp_ajax_* or wp_ajax_nopriv_* hook contains no current_user_can(), check_ajax_referer(), check_admin_referer() or wp_verify_nonce() call, so it is reachable by any logged-in user, or by anyone at all in the nopriv case."
remediation = "On wp_ajax_*, add check_ajax_referer() to verify the nonce and current_user_can() to verify the capability: the nonce proves intent, the capability proves entitlement. On wp_ajax_nopriv_*, a capability check cannot pass — the hook exists to serve logged-out visitors — so verify a nonce and confirm the endpoint reads nothing an anonymous caller should not choose. The trace step says which case this is."
cwe = "CWE-862"
message = "AJAX handler has no capability or nonce check."
