# The WordPress catalogue.
#
# Cross-checked against the WPCS sniffs WordPress.Security.EscapeOutput,
# WordPress.Security.ValidatedSanitizedInput and WordPress.DB.PreparedSQL.
# WPCS is the curated source of truth for which WordPress functions escape
# what; this file is that catalogue expressed as data.
#
# Adding a function here must never require a code change.

[meta]
name = "wordpress"
extends = ["php-core", "wordpress-generated", "wordpress-filterable"]
description = "WordPress core sources, sinks, sanitizers and escapers"

[options]
# Interpolating a table name from $wpdb into a prepare() format string is the
# standard, correct WordPress idiom. The engine treats a format string built
# only from literals and these identifiers as effectively literal, because
# flagging it would produce a false positive on nearly every plugin.
safe_database_identifiers = [
    "prefix", "base_prefix", "posts", "postmeta", "users", "usermeta", "terms",
    "termmeta", "term_taxonomy", "term_relationships", "comments", "commentmeta",
    "options", "links", "blogs", "blogmeta", "site", "sitemeta", "signups",
    "registration_log", "blog_versions", "sitecategories",
]

