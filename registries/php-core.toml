# PHP core sources, sinks, sanitizers and propagators.
#
# Nothing WordPress-specific belongs in this file. `wordpress.toml` extends it.

[meta]
name = "php-core"
description = "PHP language and standard library sources, sinks and sanitizers"

[options]
safe_database_identifiers = []


# =============================================================================
# SOURCES
# =============================================================================

[[sources]]
superglobal = "_GET"
kinds = ["html", "html_attr", "sql", "shell", "path", "url", "header", "eval", "unserialize", "ldap", "xpath", "identifier", "csv", "storage"]

[[sources]]
superglobal = "_POST"
kinds = ["html", "html_attr", "sql", "shell", "path", "url", "header", "eval", "unserialize", "ldap", "xpath", "identifier", "csv", "storage"]

[[sources]]
superglobal = "_REQUEST"
kinds = ["html", "html_attr", "sql", "shell", "path", "url", "header", "eval", "unserialize", "ldap", "xpath", "identifier", "csv", "storage"]

[[sources]]
superglobal = "_COOKIE"
kinds = ["html", "html_attr", "sql", "shell", "path", "url", "header", "eval", "unserialize", "ldap", "xpath", "identifier", "csv", "storage"]

[[sources]]
superglobal = "_FILES"
kinds = ["html", "html_attr", "sql", "path", "header", "storage"]
note = "Filenames and MIME types come straight from the client."

# $_SERVER is only partially attacker-controlled. Tainting the whole
# superglobal makes the false positive rate unmanageable, so only the keys
# below are treated as untrusted.
[[sources]]
superglobal = "_SERVER"
kinds = ["html", "html_attr", "sql", "shell", "path", "url", "header", "eval", "storage"]
keys = ["REQUEST_URI", "QUERY_STRING", "PHP_SELF", "PATH_INFO", "argv"]
key_prefixes = ["HTTP_"]
note = "HTTP_* keys are request headers verbatim. Other keys are set by the web server."

[[sources]]
function = "file_get_contents"
arg = 0
arg_literal_contains = "php://input"
kinds = ["html", "html_attr", "sql", "shell", "path", "url", "header", "eval", "unserialize", "ldap", "xpath", "storage"]
note = "The raw request body. Only a source for the php:// wrapper; every other argument makes this a path sink."

[[sources]]
function = "fopen"
arg = 0
arg_literal_contains = "php://input"
kinds = ["html", "html_attr", "sql", "shell", "path", "url", "header", "eval", "storage"]

[[sources]]
function = "getenv"
kinds = ["shell", "path", "storage"]
note = "Environment-derived, not request-derived, but still outside the code's control."

# =============================================================================
# PROPAGATORS — pass taint through unchanged
# =============================================================================
#
# These are string operations. None of them escapes anything. They exist here
# so that taint survives them, and so that nobody mistakes their presence for
# sanitisation.

[[propagators]]
function = "stripslashes"
note = "Removes backslashes. Escapes nothing."

[[propagators]]
function = "stripslashes_deep"
note = "Removes backslashes recursively. Escapes nothing."

[[propagators]]
function = "trim"

[[propagators]]
function = "ltrim"

[[propagators]]
function = "rtrim"

[[propagators]]
function = "strtolower"

[[propagators]]
function = "strtoupper"

[[propagators]]
function = "ucfirst"

[[propagators]]
function = "ucwords"

[[propagators]]
function = "lcfirst"

[[propagators]]
function = "substr"

[[propagators]]
function = "mb_substr"

[[propagators]]
function = "str_replace"
note = "Taint flows from both the subject and the replacement."

[[propagators]]
function = "str_ireplace"

# preg_replace() is a sanitizer or a propagator depending on its pattern, and no
# static entry can say which. `clears_by` names the strategy that reads the
# pattern at each call site: an allowlist class such as '/[^a-z0-9]/' with an
# empty replacement can only emit characters the class kept, so any taint kind
# whose syntax needs a character it dropped is cleared. A computed pattern, or
# one this does not understand, clears nothing and the call propagates.
[[sanitizers]]
function = "preg_replace"
all_args = true
clears_by = "allowlist_pattern"
pattern_arg = 0
replacement_arg = 1
note = "Only when the pattern is a literal allowlist class. Otherwise it propagates."

[[propagators]]
function = "preg_replace_callback"

[[propagators]]
function = "sprintf"

[[propagators]]
function = "vsprintf"

[[propagators]]
function = "implode"

[[propagators]]
function = "join"

[[propagators]]
function = "nl2br"
note = "Converts newlines to <br>. Does not escape the rest of the string."

[[propagators]]
function = "wordwrap"

[[propagators]]
function = "str_pad"

[[propagators]]
function = "strrev"

[[propagators]]
function = "strval"

[[propagators]]
function = "json_decode"
note = "Decoded structures carry the taint of the encoded string."

[[propagators]]
function = "array_map"

[[propagators]]
function = "array_fill"
note = "Repeats a value. Used with implode() to build a prepare() placeholder list for IN (...)."

[[propagators]]
function = "array_fill_keys"

[[propagators]]
function = "array_pad"

[[propagators]]
function = "str_repeat"
note = "Repeats a literal. The other half of the IN (...) placeholder idiom."

[[propagators]]
function = "array_slice"

[[propagators]]
function = "array_keys"

[[propagators]]
function = "array_combine"

[[propagators]]
function = "array_values"

[[propagators]]
function = "array_filter"

[[propagators]]
function = "array_merge"

[[propagators]]
function = "reset"

[[propagators]]
function = "current"

[[propagators]]
function = "end"

[[propagators]]
function = "urldecode"
note = "Decoding is the opposite of escaping."

[[propagators]]
function = "rawurldecode"

[[propagators]]
function = "html_entity_decode"
note = "Actively un-escapes HTML. Never treat this as a sanitizer."

[[propagators]]
function = "htmlspecialchars_decode"
note = "Actively un-escapes HTML."

[[propagators]]
function = "base64_decode"

[[propagators]]
function = "unserialize"
note = "The result carries the taint of the payload, on top of being an object injection sink."

# =============================================================================
# SANITIZERS
# =============================================================================

[[sanitizers]]
function = "intval"
clears = "*"
note = "An integer cannot carry a payload in any context."

[[sanitizers]]
function = "floatval"
clears = "*"

[[sanitizers]]
function = "doubleval"
clears = "*"

[[sanitizers]]
function = "boolval"
clears = "*"

[[sanitizers]]
function = "htmlspecialchars"
clears = ["html", "html_attr"]

[[sanitizers]]
function = "htmlentities"
clears = ["html", "html_attr"]

[[sanitizers]]
function = "strip_tags"
clears = ["html"]
note = "Removes tags but not attribute-breaking characters, so html_attr survives."

[[sanitizers]]
function = "escapeshellarg"
clears = ["shell"]

[[sanitizers]]
function = "escapeshellcmd"
clears = ["shell"]

[[sanitizers]]
function = "basename"
clears = ["path"]
note = "Strips every directory component, which defeats traversal."

[[sanitizers]]
function = "urlencode"
clears = ["html", "html_attr", "header"]
note = "Percent-encoding removes the characters that break out of an attribute or a header."

[[sanitizers]]
function = "rawurlencode"
clears = ["html", "html_attr", "header"]

[[sanitizers]]
function = "json_encode"
clears = ["html"]
imprecise = true
note = "Only safe inside a JSON context. Marked imprecise so consumers can filter."

[[sanitizers]]
function = "md5"
clears = "*"

[[sanitizers]]
function = "sha1"
clears = "*"

[[sanitizers]]
function = "hash"
arg = 1
clears = "*"

[[sanitizers]]
function = "count"
clears = "*"

[[sanitizers]]
function = "strlen"
clears = "*"

[[sanitizers]]
function = "mb_strlen"
clears = "*"

[[sanitizers]]
function = "in_array"
clears = "*"
note = "Returns a boolean, not the value."

[[sanitizers]]
function = "preg_match"
clears = "*"
note = "Returns a match count. The captured groups go out by reference; see [[byref]] below."

