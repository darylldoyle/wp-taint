# =============================================================================
# RULE METADATA
# =============================================================================

# ---------------------------------------------------------------------------
# Dispatchers: functions that call something else on your behalf.
#
# `call_user_func( $cb, $x )` is not a call to `call_user_func`. Modelling it as
# one loses every flow that passes through it, and PHP code passes a great deal
# through it.
#
# `callable` is which argument holds the callee. `mode` says how the remaining
# arguments map onto the callee's parameters, and `returns` says what the
# dispatcher hands back. An entry that also appears under [[propagators]] falls
# back to that entry whenever the callee cannot be resolved, so a dispatcher
# never makes the analysis worse than not having one.
# ---------------------------------------------------------------------------

[[dispatchers]]
function = "call_user_func"
callable = 0
mode = "rest"
returns = "callee"

[[dispatchers]]
function = "call_user_func_array"
callable = 0
mode = "spread"
returns = "callee"
note = "The argument array is one SSA operand, so its element taint feeds every parameter."

[[dispatchers]]
function = "array_map"
callable = 0
argument_start = 1
mode = "elements"
returns = "callee_array"

[[dispatchers]]
function = "array_filter"
callable = 1
argument_start = 0
mode = "elements"
returns = "own"
note = "Returns a subset of its input, not the predicate's boolean."

[[dispatchers]]
function = "array_walk"
callable = 1
argument_start = 0
mode = "elements"
returns = "own"

[[dispatchers]]
function = "array_reduce"
callable = 1
argument_start = 0
mode = "elements"
returns = "callee"

[[dispatchers]]
function = "usort"
callable = 1
argument_start = 0
mode = "elements"
returns = "own"

[[dispatchers]]
function = "uasort"
callable = 1
argument_start = 0
mode = "elements"
returns = "own"

[[dispatchers]]
function = "uksort"
callable = 1
argument_start = 0
mode = "elements"
returns = "own"

[[dispatchers]]
class = "Closure"
method = "call"
callable = 0
argument_start = 1
mode = "rest"
returns = "callee"

# ---------------------------------------------------------------------------
# Calls that write back through an argument.
#
# `preg_match( $re, $subject, $matches )` fills $matches from $subject, and until
# this section existed the caller's variable came back clean — a silent false
# negative on 1,433 by-reference sites in the corpus plus every use of the
# functions below.
#
# `writes` is the argument written through, `from` the arguments whose taint
# lands in it, and `as_container` says the taint belongs in the element slot
# rather than on the value itself: reading $matches[1] finds it, and `echo
# $matches` — which prints "Array" — does not.
#
# Effects only ever add. The lattice grows, so a call that genuinely overwrites
# its argument with something clean cannot be modelled as clearing it, and
# listing one here would achieve nothing.
# ---------------------------------------------------------------------------

[[byref]]
function = "preg_match"
writes = 2
from = [1]
as_container = true

[[byref]]
function = "preg_match_all"
writes = 2
from = [1]
as_container = true

[[byref]]
function = "parse_str"
writes = 1
from = [0]
as_container = true
note = "Takes attacker-controlled input by definition, and the result is a whole array of it."

[[byref]]
function = "array_push"
writes = 0
from = [1]
as_container = true

[[byref]]
function = "array_unshift"
writes = 0
from = [1]
as_container = true

[[byref]]
function = "array_splice"
writes = 0
from = [3]
as_container = true

[[byref]]
function = "sscanf"
writes = 2
from = [0]

[[rules]]
id = "wp.xss.unescaped-output"
title = "Untrusted input reaches output without HTML escaping"
description = "A value derived from user-controlled input reaches an output construct with html taint intact."
remediation = "Apply esc_html() for text, esc_attr() for attribute values, esc_url() for URLs, or wp_kses_post() where limited markup is intended."
cwe = "CWE-79"
message = "Untrusted input reaches output without HTML escaping."

[[rules]]
id = "wp.rce.eval"
title = "Untrusted input reaches a code evaluation sink"
description = "A value derived from user-controlled input is evaluated as PHP code."
remediation = "Remove the dynamic evaluation. If a dispatch table is what is wanted, map the input to a fixed set of callables instead."
cwe = "CWE-95"
message = "Untrusted input is evaluated as PHP code."

[[rules]]
id = "wp.rce.shell"
title = "Untrusted input reaches a shell command"
description = "A value derived from user-controlled input is interpolated into a shell command."
remediation = "Wrap every interpolated value in escapeshellarg(), or use an API that does not spawn a shell."
cwe = "CWE-78"
message = "Untrusted input reaches a shell command."

[[rules]]
id = "wp.rce.unserialize"
title = "Untrusted input reaches unserialize()"
description = "A value derived from user-controlled input is deserialised, allowing PHP object injection when a suitable gadget chain exists in the codebase."
remediation = "Use json_decode() for untrusted payloads. If unserialize() is unavoidable, pass ['allowed_classes' => false]."
cwe = "CWE-502"
message = "Untrusted input is deserialised."

[[rules]]
id = "wp.lfi.dynamic-include"
title = "Untrusted input reaches include or require"
description = "A value derived from user-controlled input is used to build the path of an included file."
remediation = "Map the input to an allowlist of known template names rather than interpolating it into a path."
cwe = "CWE-98"
message = "Untrusted input reaches an include path."

[[rules]]
id = "wp.path.file-read"
title = "Untrusted input reaches a file read"
description = "A value derived from user-controlled input is used as a path to read, allowing arbitrary file disclosure."
remediation = "Apply basename() or sanitize_file_name(), and validate the resolved path stays inside the intended directory."
cwe = "CWE-22"
message = "Untrusted input reaches a file read path."

[[rules]]
id = "wp.path.file-write"
title = "Untrusted input reaches a file write or delete"
description = "A value derived from user-controlled input is used as a path to write, move or delete."
remediation = "Apply sanitize_file_name() and confirm the resolved path is inside the uploads directory before touching it."
cwe = "CWE-22"
message = "Untrusted input reaches a file write path."

[[rules]]
id = "wp.header.injection"
title = "Untrusted input reaches an HTTP header"
# Not response splitting. PHP rejects CR and LF inside header() and refuses to
# send the header at all, and setcookie() urlencodes its value before it gets
# that far; setrawcookie() skips the encoding but not the control-character
# check. Every finding of this rule used to claim CWE-113, and every one of them
# claimed an attack the runtime has not permitted for a very long time.
#
# What is left is real and is about the header itself: a value the attacker
# chooses changes what the response means. A Content-Type they pick decides
# whether the browser parses the body as HTML; a Location they pick is where the
# visitor goes; a cookie name they pick can shadow the session cookie for a path
# they nominate, which is cookie tossing and needs no newline at all.
description = "A value derived from user-controlled input decides a response header, so the attacker chooses what the header says. A Content-Type they control decides whether the browser parses the body as HTML, a Location they control decides where the visitor goes, and a cookie name or path they control can shadow an existing cookie."
remediation = "Choose the header from a fixed set rather than building it from the request. Where the value has to vary, validate it against what that header accepts — a known content type, a URL on this host, a cookie name your code owns."
cwe = "CWE-644"
message = "Untrusted input decides an HTTP response header."

[[rules]]
id = "wp.ldap.injection"
title = "Untrusted input reaches an LDAP filter"
description = "A value derived from user-controlled input is interpolated into an LDAP filter."
remediation = "Escape the value with ldap_escape() using LDAP_ESCAPE_FILTER."
cwe = "CWE-90"
message = "Untrusted input reaches an LDAP filter."
